async function handleLogin(e){
  e.preventDefault();
  const btn=document.getElementById("loginBtn"), err=document.getElementById("loginError");
  err.textContent="";
  btn.disabled=true; btn.innerHTML="Memeriksa akun…";
  try{
    if(DEMO_MODE){
      await new Promise(r=>setTimeout(r,650));
      throw new Error("Mode mockup aktif. Gunakan tombol 'Masuk sebagai Superadmin (Demo)' atau matikan DEMO_MODE saat Supabase siap.");
    }
    const email=document.getElementById("loginEmail").value.trim();
    const password=document.getElementById("loginPassword").value;
    const {data,error}=await supabaseClient.auth.signInWithPassword({email,password});
    if(error) throw error;
    const {data:profile,error:profileError}=await supabaseClient.from("profiles").select("id,full_name,email,role,is_active").eq("id",data.user.id).single();
    if(profileError) throw profileError;
    if(!profile.is_active) throw new Error("Akun Anda tidak aktif. Hubungi administrator.");
    state.authenticated=true; state.user=profile; state.role=profile.role||"guru"; state.tab="dashboard";
    restoreShell(); renderApp();
  }catch(ex){
    err.textContent=ex.message||"Login gagal. Periksa kembali email dan password.";
  }finally{
    btn.disabled=false; btn.innerHTML='Masuk ke Sistem <span>→</span>';
  }
}
function demoLogin(){
  state.authenticated=true;state.user={full_name:"Administrator Kesiswaan",email:"admin@smksgrafika.sch.id",role:"superadmin",is_active:true};state.role="superadmin";state.tab="dashboard";restoreShell();renderApp();
}
function restoreShell(){
  document.querySelector(".sidebar").style.display="";
  document.querySelector(".main").style.marginLeft="";
  document.querySelector(".topbar").style.display="";
  document.getElementById("roleSwitch")?.remove();
  const actions=document.querySelector(".top-actions");
  if(actions && !document.getElementById("logoutTop")) actions.insertAdjacentHTML("beforeend",'<button class="btn btn-light btn-sm" id="logoutTop" onclick="logout()">Keluar</button>');
  const side=document.querySelector(".user-mini");
  if(side && state.user) side.innerHTML='<div class="avatar">'+initials(state.user.full_name||"User")+'</div><div><strong>'+esc(state.user.full_name||"Pengguna")+'</strong><span>'+esc(roleLabel(state.role))+'</span></div>';
}

function openModal(title,body){document.getElementById("modalTitle").textContent=title;document.getElementById("modalBody").innerHTML=body;document.getElementById("modal").classList.add("show")}
function closeModal(){document.getElementById("modal").classList.remove("show")}
function saveModal(){closeModal();toast("Demo: data berhasil disimpan. Supabase akan menangani penyimpanan pada versi terhubung.")}
function openViolation(){openModal("Catat Pelanggaran",`<div class="form-grid"><div class="field"><label>Tanggal</label><input class="input" type="date" value="2026-10-01"></div><div class="field"><label>Siswa</label><select class="select"><option>Bagas Pratama — XII DKV 1</option><option>Dimas Saputra — XI DKV 2</option></select></div><div class="field"><label>Jenis Pelanggaran</label><select class="select"><option>Terlambat — 5 poin</option><option>Tidak memakai atribut — 10 poin</option><option>Meninggalkan kelas — 15 poin</option></select></div><div class="field"><label>Poin</label><input class="input" type="number" value="5"></div><div class="field full"><label>Penjelasan</label><textarea class="textarea" placeholder="Jelaskan kejadian..."></textarea></div></div>`)}
function openFollow(name){openModal("Tindak Lanjut Pelanggaran",`<div style="margin-bottom:14px;padding:10px;background:#f7f6ff;border-radius:10px;font-size:10px"><b>${name}</b><br><span class="muted">Tindakan dapat dicatat lebih dari satu kali.</span></div><div class="form-grid"><div class="field"><label>Tanggal</label><input class="input" type="date" value="2026-10-01"></div><div class="field"><label>Jenis Tindakan</label><select class="select"><option>Pembinaan</option><option>Teguran</option><option>Panggilan Orang Tua</option><option>Monitoring</option></select></div><div class="field full"><label>Penjelasan Tindakan</label><textarea class="textarea" placeholder="Tuliskan tindakan yang dilakukan..."></textarea></div><div class="field full"><label>Status</label><select class="select"><option>Selesai</option><option>Dipantau</option></select></div></div>`)}
function openActivity(){openModal("Tambah Pembiasaan",`<div class="form-grid"><div class="field"><label>Nama Kegiatan</label><input class="input" placeholder="Contoh: Literasi"></div><div class="field"><label>Kode</label><input class="input" placeholder="LITERASI"></div><div class="field"><label>Hari</label><select class="select"><option>Senin</option><option>Selasa</option><option>Rabu</option><option>Kamis</option><option>Jumat</option></select></div><div class="field"><label>Jam</label><input class="input" type="time" value="07:00"></div><div class="field full"><label>Dimensi Profil Lulusan</label><select class="select"><option>Penalaran Kritis</option><option>Kewargaan</option><option>Kolaborasi</option><option>Kesehatan</option></select></div></div>`)}
function openCalendar(){openModal("Atur Kalender Sekolah",`<div class="form-grid"><div class="field"><label>Tanggal</label><input class="input" type="date" value="2026-10-17"></div><div class="field"><label>Status</label><select class="select"><option>LIBUR</option><option>DITIADAKAN</option><option>NORMAL</option></select></div><div class="field full"><label>Deskripsi</label><input class="input" placeholder="Contoh: Hari libur nasional / kegiatan sekolah"></div></div>`)}
function openStudent(){openModal("Tambah Peserta Didik",`<div class="form-grid"><div class="field"><label>NIS</label><input class="input"></div><div class="field"><label>NISN</label><input class="input"></div><div class="field"><label>Nama Lengkap</label><input class="input"></div><div class="field"><label>Kelas</label><select class="select"><option>X DKV 1</option><option>XI DKV 2</option><option>XII DKV 1</option></select></div><div class="field"><label>Jenis Kelamin</label><select class="select"><option>Laki-laki</option><option>Perempuan</option></select></div></div>`)}
function printReport(){window.print()}
function toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2200)}
renderApp();
</script>
