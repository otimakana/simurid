  return String(name||"??").split(/\s+/).filter(Boolean).slice(0,2).map(x=>x[0]).join("").toUpperCase();
}
function todayISO(){
  const d=new Date(); return localISO(d);
}
function localISO(d){
  const x=new Date(d); x.setMinutes(x.getMinutes()-x.getTimezoneOffset());
  return x.toISOString().slice(0,10);
}
function mondayOf(date){
  const d=new Date(date); d.setHours(0,0,0,0);
  const day=d.getDay() || 7; d.setDate(d.getDate()-day+1);
  return localISO(d);
}
function addDays(iso,n){
  const d=new Date(iso+"T00:00:00"); d.setDate(d.getDate()+n); return localISO(d);
}
function firstDayOfMonth(){
  const d=new Date(); d.setDate(1); return localISO(d);
}
function fmtDate(v){
  if(!v)return "-";
  const d=new Date(v+"T00:00:00");
  return d.toLocaleDateString("id-ID",{day:"2-digit",month:"2-digit",year:"numeric"});
}
function dayName(weekday){
  return ["","Senin","Selasa","Rabu","Kamis","Jumat","Sabtu","Minggu"][Number(weekday)] || "-";
}
function statusBadge(s){
  const m={Selesai:"badge-green",Dipantau:"badge-orange",Aktif:"badge-green",HADIR:"badge-green",TERLAMBAT:"badge-orange",SAKIT:"badge-blue",IZIN:"badge-purple",ALFA:"badge-red"};

}

/**
 * Ambil presensi hanya pada rentang yang dibutuhkan.
 * Supabase/PostgREST dapat membatasi hasil satu request, jadi rentang tetap
 * dipagination agar aman jika data dalam periode tersebut > 1000 row.
 */
async function fetchAttendanceRange(fromDate,toDate){
  const PAGE_SIZE=1000;
  let all=[];
  let from=0;

  while(true){
    const {data,error}=await supabaseClient
      .from("habit_attendance")
      .select("id,attendance_date,habit_program_id,student_id,status,notes,recorded_by,attendance_time,late_minutes,late_notes,updated_at")
      .gte("attendance_date",fromDate)
      .lte("attendance_date",toDate)
      .order("attendance_date",{ascending:false})
      .order("id",{ascending:false})
      .range(from,from+PAGE_SIZE-1);

    if(error)throw error;
    if(!data || data.length===0)break;

    all=all.concat(data);
    if(data.length<PAGE_SIZE)break;
    from+=PAGE_SIZE;
  }

  console.log(`[SIMURID] fetchAttendanceRange ${fromDate} s.d. ${toDate}:`,all.length,"records");
  return all;
}

// Hanya simpan satu rentang attendance aktif di browser.
let attendanceCacheRange={from:null,to:null};

async function ensureAttendanceRange(fromDate,toDate,force=false){
  if(!fromDate || !toDate)return;
  // Jika range sama dan tidak dipaksa, gunakan cache.
  // Setelah SAVE, force=true agar data terbaru selalu diambil dari Supabase.
  if(!force && attendanceCacheRange.from===fromDate && attendanceCacheRange.to===toDate)return;

  const data=await fetchAttendanceRange(fromDate,toDate);
  state.attendance=data||[];
  attendanceCacheRange={from:fromDate,to:toDate};
  console.log("[SIMURID] Attendance cache:",state.attendance.length,"records",attendanceCacheRange);
}

/* ---------------- Unified attendance ---------------- */
function weekDates(){
  return Array.from({length:5},(_,i)=>addDays(state.weekStart,i));
}
function programForDate(date){
  const wd=new Date(date+"T00:00:00").getDay()||7;
  return state.programs.filter(p=>Number(p.weekday)===wd);
}
function calendarStatus(date){
  return state.calendar.find(x=>x.calendar_date===date)?.status||"NORMAL";
}
function studentsForClass(classId){
  return state.students.filter(s=>!classId||s.class_id===classId);
}
function attendanceKey(date,programId,studentId){
  return `${date}__${programId}__${studentId}`;
}
function attFor(date,programId,studentId){
  return state.attendance.find(x=>
    x.attendance_date===date &&
    x.habit_program_id===programId &&
    x.student_id===studentId
  );
}
function draftKey(date,pid,sid){return attendanceKey(date,pid,sid);}
function getDraft(date,pid,sid){
  const k=draftKey(date,pid,sid);
  if(Object.prototype.hasOwnProperty.call(state.attendanceDraft,k)){
    return state.attendanceDraft[k];
  }
  const existing=attFor(date,pid,sid);
  if(existing)return {status:existing.status,dirty:false,originalStatus:existing.status};
  // Tidak ada record = default HADIR, dan dianggap DIRTY.
  // Dengan demikian seluruh siswa yang belum memiliki record akan
  // ikut dibuat saat operator menekan Simpan.
  return {
    status:"HADIR",
    dirty:true,
    originalStatus:null,
    isDefaultPresent:true,
    attendance_time:null,
    late_minutes:null,
    late_notes:null
  };
}
function setDraft(date,pid,sid,status,extra={}){
  const existing=attFor(date,pid,sid);
  state.attendanceDraft[draftKey(date,pid,sid)]={
    status,
    originalStatus:existing?.status||null,
    dirty:status!== (existing?.status||null),
    ...extra
  };
}
function statusClass(status){
  return status==="HADIR"?"h":status==="TERLAMBAT"?"t":status==="SAKIT"?"s":status==="IZIN"?"i":status==="ALFA"?"a":"empty-status";
}
function statusLabel(status){
  return {HADIR:"H - Hadir",TERLAMBAT:"T - Terlambat",SAKIT:"S - Sakit",IZIN:"I - Izin",ALFA:"A - Alfa"}[status]||"— Belum diisi";
}
function attendanceStateBadge(d){
  if(d?.isDefaultPresent) return `<span class="att-default-badge">H Default</span>`;
  if(d?.dirty) return `<span class="att-edit-badge">● Belum disimpan</span>`;
  if(d?.status) return `<span class="att-saved-badge">✓ Tersimpan</span>`;
  return `<span class="att-empty-badge">Belum diisi</span>`;
}

function statusButton(date,pid,sid,status,current){
  const labels={HADIR:"H",SAKIT:"S",IZIN:"I",ALFA:"A",TERLAMBAT:"T"};
  const titles={HADIR:"Hadir",SAKIT:"Sakit",IZIN:"Izin",ALFA:"Alfa",TERLAMBAT:"Terlambat"};
  return `<button type="button" class="att-choice ${statusClass(status)} ${current===status?"selected":""}"
    title="${titles[status]}"
    onclick="chooseAttendance('${date}','${pid}','${sid}','${status}',this)">${labels[status]}</button>`;
}

function attendanceCell(date,pid,sid){
  const future=date>todayISO();
  const unavailable=calendarStatus(date)!=="NORMAL";
  const d=getDraft(date,pid,sid);

  if(unavailable){
    const label=calendarStatus(date)==="LIBUR"?"☒ Libur":"⊘ Ditiadakan";
    return `<div class="att-cell"><div class="att-status locked">${label}</div></div>`;
  }
  if(future){
    return `<div class="att-cell"><div class="att-status locked">🔒 Belum tersedia</div></div>`;
  }

  return `<div class="att-cell att-cell-editable">
    <div class="att-current ${d.status?statusClass(d.status):"empty-status"}">
      <strong>${statusLabel(d.status)}</strong>
      ${attendanceStateBadge(d)}
    </div>
    <div class="att-choice-wrap">
      ${["HADIR","SAKIT","IZIN","ALFA","TERLAMBAT"].map(st=>statusButton(date,pid,sid,st,d.status)).join("")}
    </div>

}

function eligibleAttendanceCells(){
  const classId=state.attendanceClass;
  if(!classId)return [];
  const students=studentsForClass(classId);
  const out=[];
  for(const date of weekDates()){
    if(date>todayISO() || calendarStatus(date)!=="NORMAL")continue;
    for(const program of programForDate(date)){
      for(const student of students){
        out.push({date,pid:program.id,sid:student.id});
      }
    }
  }
  return out;
}

function markPresentDraft(date,pid,sid){
  const existing=attFor(date,pid,sid);
  const key=draftKey(date,pid,sid);
  state.attendanceDraft[key]={
    status:"HADIR",
    originalStatus:existing?.status||null,
    dirty:existing?.status!=="HADIR",
    attendance_time:null,
    late_minutes:null,
    late_notes:null,
    bulkPresent:true
  };
}

function markDayPresent(date,pid){
  if(date>todayISO() || calendarStatus(date)!=="NORMAL")return;
  const students=studentsForClass(state.attendanceClass);
  students.forEach(s=>markPresentDraft(date,pid,s.id));
  render();
  toast(`Semua siswa pada ${fmtDate(date)} ditandai Hadir.`);
}

function markAllPresent(){
  eligibleAttendanceCells().forEach(x=>markPresentDraft(x.date,x.pid,x.sid));
  render();
  toast("Semua siswa pada hari yang tersedia ditandai Hadir.");
}

function markAllPresentToday(){
  const date=todayISO();
  for(const program of programForDate(date)){
    studentsForClass(state.attendanceClass).forEach(s=>markPresentDraft(date,program.id,s.id));
  }
  render();
  toast("Semua siswa hari ini ditandai Hadir.");

async function chooseAttendance(date,pid,sid,status,clickedButton){
  if(date>todayISO()){toast("Tanggal mendatang dikunci.");return;}
  if(calendarStatus(date)!=="NORMAL"){toast("Tanggal LIBUR/DITIADAKAN tidak dapat diisi.");return;}

  const existing=attFor(date,pid,sid);
  const key=draftKey(date,pid,sid);
  const current=state.attendanceDraft[key]?.status ?? existing?.status ?? null;

  // Klik status yang sama dua kali tidak menghapus data; status tetap valid.
  // Klik status berbeda berarti EDIT terhadap record yang sudah tersimpan.
  state.attendanceDraft[key]={
    status,
    originalStatus:existing?.status||null,
    dirty:status!==(existing?.status||null),
    attendance_time:null,
    late_minutes:status==="TERLAMBAT"?0:null,
    late_notes:null,
    bulkPresent:false,
    isDefaultPresent:false
  };

  const wrap=clickedButton?.closest?.(".att-cell");
  if(wrap){
    wrap.querySelectorAll(".att-choice").forEach(btn=>btn.classList.remove("selected"));
    clickedButton.classList.add("selected");
    const currentBox=wrap.querySelector(".att-current");
    if(currentBox){
      currentBox.className=`att-current ${statusClass(status)}`;
      currentBox.innerHTML=`<strong>${statusLabel(status)}</strong><span class="att-edit-badge">● Belum disimpan</span>`;
    }
  }

  const saveBtn=document.getElementById("saveAttendanceBtn");
  if(saveBtn){saveBtn.disabled=false;saveBtn.textContent="✓ Simpan Perubahan";}
  const mini=document.querySelector(".att-mini-note");
  if(mini){mini.innerHTML="<b>Ada perubahan belum disimpan.</b> Klik Simpan Perubahan.";}
}

async function saveAttendanceDraft(){
  const btn=document.getElementById("saveAttendanceBtn");
  if(btn){btn.disabled=true;btn.textContent="Menyimpan...";}

  const errorText=(e)=>{
    if(!e)return "Kesalahan tidak diketahui.";
    return [e.message,e.details,e.hint,e.code]
      .filter(Boolean)
      .join(" | ");
  };

  try{
    if(!state.attendanceClass)throw new Error("Pilih kelas terlebih dahulu.");
    if(!state.user?.id)throw new Error("Sesi pengguna tidak ditemukan. Silakan login kembali.");

    const pending=Object.entries(state.attendanceDraft)
      .filter(([,d])=>d?.dirty&&d?.status)
      .map(([key,draft])=>{
        const [date,pid,sid]=key.split("__");
        return {key,date,pid,sid,draft};
      });

    // PRIORITAS 8: record yang belum ada dianggap default HADIR dan ikut
    // dibuat ketika operator menekan Simpan. Record yang sudah ada tetap
    // hanya diproses jika memang berubah.
    const defaultPresent=eligibleAttendanceCells()
      .filter(x=>!attFor(x.date,x.pid,x.sid))
      .filter(x=>!state.attendanceDraft[draftKey(x.date,x.pid,x.sid)])
      .map(x=>({
        key:draftKey(x.date,x.pid,x.sid),
        date:x.date,
        pid:x.pid,
        sid:x.sid,
        draft:{
          status:"HADIR",
          dirty:true,
          originalStatus:null,
          isDefaultPresent:true,
          attendance_time:null,
          late_minutes:null,
          late_notes:null
        }
      }));

    const changed=[...pending,...defaultPresent].filter(x=>
      x.date<=todayISO() && calendarStatus(x.date)==="NORMAL"
    );

    if(!changed.length){
      if(btn){btn.disabled=false;btn.textContent="✓ Simpan Perubahan";}
      toast("Tidak ada perubahan presensi yang dapat disimpan.");
      return;
    }

    const payload=changed.map(x=>({
      attendance_date:x.date,
      habit_program_id:x.pid,
      student_id:x.sid,
      status:x.draft.status,
      notes:x.draft.late_notes||null,
      recorded_by:state.user.id,
      attendance_time:x.draft.attendance_time||null,
      late_minutes:x.draft.late_minutes??null,
      late_notes:x.draft.late_notes||null
    }));

    console.log("[SIMURID] attendance upsert payload",payload);

    const {data,error}=await supabaseClient
      .from("habit_attendance")
      .upsert(payload,{
        onConflict:"attendance_date,habit_program_id,student_id"
      })
      .select("id,status,attendance_date,habit_program_id,student_id");

    if(error)throw error;

    console.log("[SIMURID] attendance upsert result",data);

    // Refresh hanya minggu aktif, tetapi cache tanggal lain tetap dipertahankan.
    await reloadAttendance();

    const savedKeys=new Set((data||[]).map(r=>
      attendanceKey(r.attendance_date,r.habit_program_id,r.student_id)
    ));

    // Jika PostgREST mengembalikan data lebih sedikit daripada payload,
    // jangan diam-diam menghapus perubahan yang belum terverifikasi.
    const failures=changed
      .filter(x=>!savedKeys.has(x.key))
      .map(x=>({
        key:x.key,
        label:`${state.students.find(s=>s.id===x.sid)?.full_name||x.sid} · ${state.programs.find(p=>p.id===x.pid)?.name||x.pid} · ${fmtDate(x.date)}`,
        error:{message:"Record tidak dikembalikan oleh Supabase setelah upsert."}
      }));

    const failedKeys=new Set(failures.map(f=>f.key));
    const nextDraft={};
    for(const [key,draft] of Object.entries(state.attendanceDraft)){
      if(failedKeys.has(key))nextDraft[key]=draft;
    }
    state.attendanceDraft=nextDraft;
    render();

    if(failures.length){
      console.error("Detail kegagalan presensi:",failures);
      const detail=failures.slice(0,5)
        .map(f=>`• ${f.label}\n  ${errorText(f.error)}`)
        .join("\n\n");
      alert(`GAGAL MEMVERIFIKASI ${failures.length} DATA:\n\n${detail}`);
      toast(`${(data||[]).length} tersimpan, ${failures.length} gagal diverifikasi.`);
      return;
    }

    toast(`Presensi berhasil disimpan: ${(data||[]).length} data.`);
  }catch(e){
    console.error("Gagal menyimpan presensi:",e);
    const msg=errorText(e);
    alert(`GAGAL MENYIMPAN PRESENSI\n\n${msg}`);
    toast(`Gagal menyimpan presensi: ${msg}`);
  }finally{
    const b=document.getElementById("saveAttendanceBtn");
    if(b){
      const dirty=Object.values(state.attendanceDraft).some(d=>d?.dirty);
      b.disabled=!dirty;
      b.textContent=dirty?"✓ Simpan Perubahan":"✓ Simpan Presensi";
    }
  }
}

/* ---------------- Attendance recap ---------------- */
function effectiveOpportunities(from,to,programId=""){
  const result=[];
  for(let d=from;d<=to;d=addDays(d,1)){
    if(d>todayISO())break;
    const wd=new Date(d+"T00:00:00").getDay()||7;
    if(wd>5)continue;
    if(calendarStatus(d)!=="NORMAL")continue;
    const ps=state.programs.filter(p=>Number(p.weekday)===wd&&(!programId||p.id===programId));
    ps.forEach(p=>result.push({date:d,program:p}));
  }
  return result;
}
function recapRows(){
  const f=state.recapFilters;
  const opportunities=effectiveOpportunities(f.from,f.to,f.programId);
  const students=studentsForClass(f.classId).filter(s=>!f.studentId||s.id===f.studentId);
  return students.map(s=>{
    const row={student:s,H:0,T:0,S:0,I:0,A:0,opportunities:0};
    const ops=opportunities;
    row.opportunities=ops.length;
    ops.forEach(o=>{
      const a=attFor(o.date,o.program.id,s.id);
      const st=a?.status;
      if(st==="HADIR")row.H++;
      else if(st==="TERLAMBAT")row.T++;
      else if(st==="SAKIT")row.S++;
      else if(st==="IZIN")row.I++;
      else if(st==="ALFA")row.A++;
    });
    row.present=row.H+row.T;
    row.absent=row.S+row.I+row.A;
    row.attendancePct=row.opportunities?Math.round(row.present/row.opportunities*10000)/100:0;
    row.absencePct=row.opportunities?Math.round(row.absent/row.opportunities*10000)/100:0;
    return row;
  });
}

async function saveUserProfile(id=""){
  if(state.profile?.role!=="superadmin")throw new Error("Hanya Superadmin yang dapat mengelola pengguna.");
  const fullName=document.getElementById("userFullName")?.value.trim();
  const email=document.getElementById("userEmail")?.value.trim().toLowerCase();
  const role=document.getElementById("userRole")?.value;
  const isActive=document.getElementById("userActive")?.value!=="false";
  if(!fullName)throw new Error("Nama lengkap wajib diisi.");
  if(!email)throw new Error("Email wajib diisi.");
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email))throw new Error("Format email tidak valid.");
  if(!["superadmin","kesiswaan","guru","siswa"].includes(role))throw new Error("Role tidak valid.");

  if(id){
    // Jangan biarkan Superadmin tanpa Superadmin aktif sama sekali.
    if(id===state.user?.id && role!=="superadmin"){
      const activeAdmins=(state.profiles||[]).filter(x=>x.role==="superadmin"&&x.is_active&&x.id!==id).length;
      if(!activeAdmins)throw new Error("Akun Superadmin terakhir tidak boleh diturunkan rolenya.");
    }
    if(id===state.user?.id && !isActive){
      const activeAdmins=(state.profiles||[]).filter(x=>x.role==="superadmin"&&x.is_active&&x.id!==id).length;
      if(!activeAdmins)throw new Error("Akun Superadmin yang sedang digunakan tidak boleh dinonaktifkan jika tidak ada Superadmin aktif lain.");
    }

    const {error}=await supabaseClient.from("profiles").update({
      full_name:fullName,
      role,
      is_active:isActive,
      updated_at:new Date().toISOString()
    }).eq("id",id);
    if(error)throw error;
    await loadProfiles();
    render();
    toast("Profile pengguna diperbarui.");
    return;
  }

  const password=document.getElementById("userPassword")?.value||"";
  if(password.length<6)throw new Error("Password awal minimal 6 karakter.");

  /*
    Browser TIDAK boleh memakai service_role key.
    Kita menggunakan client Auth terpisah dengan persistSession:false
    agar proses signUp tidak mengganti sesi Superadmin utama.
  */
  const authClient=window.supabase.createClient(
    SUPABASE_CONFIG.url,
    SUPABASE_CONFIG.key,
    {auth:{autoRefreshToken:false,persistSession:false,detectSessionInUrl:false}}
  );

  const {data,error}=await authClient.auth.signUp({email,password});
  if(error)throw error;
  const authUser=data?.user;
  if(!authUser?.id)throw new Error("Supabase Auth tidak mengembalikan user. Periksa pengaturan Sign Up pada project.");

  const {error:profileError}=await supabaseClient.from("profiles").insert({
    id:authUser.id,
    full_name:fullName,
    email,
    role,
    is_active:isActive
  });

  if(profileError){
    /*
      User Auth sudah dibuat. Browser dengan publishable key tidak memiliki
      hak aman untuk menghapus Auth user. Karena itu jangan menyamarkan error;
      tampilkan ID agar admin dapat menindaklanjuti di Authentication > Users.
    */
    throw new Error(`Akun Auth berhasil dibuat, tetapi profile gagal dibuat (${profileError.message}). User ID: ${authUser.id}. Periksa RLS profiles.`);
  }

  await loadProfiles();
  render();
  toast(`Pengguna ${fullName} berhasil dibuat sebagai ${role}.`);
}

function normalizeClassName(v){
  return String(v||"")
    .toUpperCase()
    .replace(/[‐‑‒–—−]/g,"-")
    .replace(/[^A-Z0-9]+/g,"")
    .trim();
}
function findClassForImport(className){
  const raw=String(className||"").trim();
  if(!raw)return null;
  const exact=state.classes.find(c=>String(c.name||"").trim().toLowerCase()===raw.toLowerCase());
  if(exact)return exact;

  const n=normalizeClassName(raw);
  const normalized=state.classes.find(c=>normalizeClassName(c.name)===n);
  if(normalized)return normalized;

  // Common school notation: "XTG" ↔ "X TG" ↔ "X-TG".
  const gradeMajor=/^(XII|XI|X|IX|VIII|VII)(.*)$/i.exec(n);
  if(gradeMajor){
    const grade=gradeMajor[1].toUpperCase(), major=gradeMajor[2];
    const candidate=state.classes.find(c=>{
      const cn=normalizeClassName(c.name);
      return cn.startsWith(grade) && cn.slice(grade.length)===major;
    });
    if(candidate)return candidate;
  }
  return null;
}
function classSelectForImport(raw){
  const matched=findClassForImport(raw);
  if(matched)return statusBadge("Aktif");
  const key=String(raw||"");
  const selected=state.importClassMap[key]||"";
  return `<select class="select import-class-map" data-raw-class="${esc(key)}" onchange="state.importClassMap[this.dataset.rawClass]=this.value">

async function importStudents(){
  if(!state.importRows.length)throw new Error("Belum ada file atau data Excel.");

  const rows=state.importRows;
  const errors=[];

  // =========================================================
  // MASTER KELAS:
  // Tidak perlu diinput terlebih dahulu di aplikasi.
  // Nama kelas dari Excel otomatis menjadi master pada
  // public.classes jika belum tersedia.
  // =========================================================
  const uniqueClassNames=[...new Set(
    rows.map(r=>String(r.class_name||"").trim()).filter(Boolean)
  )];

  if(!uniqueClassNames.length){
    throw new Error("Kolom Kelas tidak ditemukan atau seluruhnya kosong.");
  }

  // Pastikan kelas yang sudah ada dimanfaatkan terlebih dahulu.
  const classMap=new Map();
  state.classes.forEach(c=>{
    classMap.set(normalizeClassName(c.name),c);
  });

  // Buat master kelas yang belum ada.
  const newClasses=uniqueClassNames
    .filter(name=>!classMap.has(normalizeClassName(name)))
    .map(name=>({
      name:name,
      grade:deriveGrade(name),
      major:deriveMajor(name),
      is_active:true
    }));

  if(newClasses.length){
    const {data,error}=await supabaseClient
      .from("classes")
      .insert(newClasses)
      .select("id,name,grade,major,is_active");

    if(error)throw new Error(
      "Gagal membuat Master Kelas otomatis: "+error.message
    );

    (data||[]).forEach(c=>{
      classMap.set(normalizeClassName(c.name),c);
    });
  }

  // Ambil ulang master kelas agar ID yang baru dibuat pasti tersedia.
  const {data:allClasses,error:classError}=await supabaseClient
    .from("classes")
    .select("id,name,grade,major,is_active")
    .eq("is_active",true);

  if(classError)throw classError;

  (allClasses||[]).forEach(c=>{
    classMap.set(normalizeClassName(c.name),c);
  });

  const payload=rows.map((r,i)=>{
    const className=String(r.class_name||"").trim();
    const normalized=normalizeClassName(className);

    let c=classMap.get(normalized);

    // Fallback ke pemetaan manual jika memang diperlukan.
    if(!c && state.importClassMap[className]){
      c=(allClasses||[]).find(x=>x.id===state.importClassMap[className]);
    }

    if(!r.nis||!r.full_name||!className){
      errors.push(`Baris ${i+2}: NIS, nama, dan kelas wajib.`);
      return null;
    }

    if(!c){
      errors.push(`Baris ${i+2}: kelas "${className}" gagal dibuat/ditemukan.`);
      return null;
    }

    return {
      nis:r.nis,
      nisn:r.nisn||null,
      full_name:r.full_name,
      class_id:c.id,
      gender:r.gender||null,
      is_active:true
    };
  }).filter(Boolean);

  if(errors.length){
    throw new Error(
      errors.slice(0,8).join(" | ")+
      (errors.length>8?` | dan ${errors.length-8} error lainnya.`:"")
    );
  }

  const {error}=await supabaseClient
    .from("students")
    .upsert(payload,{onConflict:"nis"});

  if(error)throw error;

  state.importRows=[];
  state.importClassMap={};

  await loadAll();
  updateIdentity();
  render();

  toast(
    `${payload.length} siswa berhasil diimport. `+
    `${newClasses.length} master kelas baru dibuat otomatis.`
  );
}

// XTG -> X, TG
// X TG -> X, TG
// XI DKV 1 -> XI, DKV 1
// XII RPL 2 -> XII, RPL 2
function deriveGrade(className){
  const s=String(className||"").trim().toUpperCase();
  const m=s.match(/^(XII|XI|X|IX|VIII|VII)/);
  return m?m[1]:null;
}

function deriveMajor(className){
  const s=String(className||"").trim().toUpperCase();
  const grade=deriveGrade(s);
  if(!grade)return null;

  let rest=s.slice(grade.length).trim();
  rest=rest.replace(/^[\s\-]+/,"").trim();

  return rest||null;
}

views.kalender=()=>{
  const base=new Date(state.raporFrom+"T00:00:00"); base.setDate(1);
  const y=base.getFullYear(),m=base.getMonth(),first=new Date(y,m,1),start=(first.getDay()||7)-1;
  const days=new Date(y,m+1,0).getDate();
  let cells="";
  for(let i=0;i<start;i++)cells+=`<div class="cal-day muted"></div>`;
  for(let d=1;d<=days;d++){
    const iso=localISO(new Date(y,m,d)), c=state.calendar.find(x=>x.calendar_date===iso);
    const cls=c?.status==="LIBUR"?"holiday":c?.status==="DITIADAKAN"?"active":"";
    cells+=`<div class="cal-day ${cls}" onclick="openCalendar('${iso}')"><b>${d}</b>${c?`<div class="cal-event">${esc(c.status)}</div>`:""}</div>`;
  }
  return layout("Kalender Sekolah","Hari LIBUR/DITIADAKAN tidak menjadi kesempatan presensi.",
  `<div class="card"><div class="card-head"><div><h3>${base.toLocaleDateString("id-ID",{month:"long",year:"numeric"})}</h3><p>Kelola tanggal khusus sekolah.</p></div><button class="btn btn-primary" onclick="openCalendar()">＋ Atur Tanggal</button></div>
  <div class="calendar">${["Sen","Sel","Rab","Kam","Jum","Sab","Min"].map(x=>`<div class="cal-head">${x}</div>`).join("")}${cells}</div></div>`);
};

/* ---------------- Rapor ---------------- */
function characterDescription(x){
  if(!x.evidence) return "Belum cukup data untuk menggambarkan perkembangan pada dimensi ini.";
  const late=x.T||0, absent=(x.S||0)+(x.I||0)+(x.A||0);
  const level=x.level;
  const dim=(x.dim?.name||"").toLowerCase();
  let text="";
  if(dim.includes("keimanan")) text=`Menunjukkan perkembangan ${level.toLowerCase()} dalam mengikuti pembiasaan keagamaan dan membangun konsistensi sikap positif dalam kegiatan sekolah.`;
  else if(dim.includes("kewargaan")) text=`Menunjukkan perkembangan ${level.toLowerCase()} dalam mengikuti kegiatan kebangsaan, menjaga ketertiban, dan menghargai aturan serta kegiatan bersama.`;
  else if(dim.includes("penalaran kritis")) text=`Menunjukkan perkembangan ${level.toLowerCase()} dalam mengikuti kegiatan yang mendorong kemampuan memahami informasi, berpikir, dan memberikan tanggapan.`;
  else if(dim.includes("kreativitas")) text=`Menunjukkan perkembangan ${level.toLowerCase()} dalam mengeksplorasi gagasan dan berpartisipasi dalam kegiatan yang memberi ruang untuk menghasilkan ide atau karya.`;
  else if(dim.includes("kolaborasi")) text=`Menunjukkan perkembangan ${level.toLowerCase()} dalam bekerja sama, berpartisipasi, dan menjalankan peran dalam kegiatan bersama.`;
  else if(dim.includes("kemandirian")) text=`Menunjukkan perkembangan ${level.toLowerCase()} dalam mengikuti kegiatan secara bertanggung jawab dan membangun kebiasaan menyelesaikan tugas atau aktivitas secara mandiri.`;
  else if(dim.includes("kesehatan")) text=`Menunjukkan perkembangan ${level.toLowerCase()} dalam mengikuti kegiatan yang mendukung kebugaran, kesehatan, dan kebiasaan hidup sehat.`;
  else if(dim.includes("komunikasi")) text=`Menunjukkan perkembangan ${level.toLowerCase()} dalam menyampaikan tanggapan, mengikuti interaksi, dan berpartisipasi dalam komunikasi yang positif.`;
  else text=`Menunjukkan perkembangan ${level.toLowerCase()} melalui partisipasi dalam kegiatan pembiasaan yang terhubung dengan dimensi ini.`;
  if(late>=2) text += " Konsistensi kedisiplinan waktu masih perlu diperkuat.";
  if(absent>0 && late<2) text += " Konsistensi mengikuti kegiatan perlu terus dipertahankan dan diperkuat.";
  if(late===0 && absent===0) text += " Konsistensi mengikuti kegiatan pada periode ini sudah baik dan perlu dipertahankan.";
  return text;
}
function characterStrength(r){
  const scored=Object.values(r.byDim).filter(x=>x.score!=null);
  if(!scored.length)return "Belum cukup data untuk menyusun ringkasan perkembangan karakter.";
  const avg=scored.reduce((a,x)=>a+x.score,0)/scored.length;
  const level=avg<1.75?"Perlu Bimbingan":avg<2.5?"Cukup":avg<3.5?"Baik":"Sangat Baik";
  const top=scored.slice().sort((a,b)=>b.score-a.score).slice(0,2).map(x=>x.dim.name);
  return `Berdasarkan evidence kegiatan pembiasaan pada periode ini, perkembangan karakter peserta didik berada pada kategori ${level}. Perkembangan yang paling menonjol terlihat pada ${top.join(" dan ")}.`;
}
function characterFollowUp(r){
  const scored=Object.values(r.byDim).filter(x=>x.score!=null);
  const late=scored.reduce((a,x)=>a+x.T,0), absent=scored.reduce((a,x)=>a+x.S+x.I+x.A,0);
  if(!scored.length)return "Data pembiasaan perlu dilengkapi agar perkembangan karakter dapat dideskripsikan dengan lebih akurat.";
  if(late>=3)return "Pertahankan partisipasi dalam pembiasaan dan berikan penguatan pada kedisiplinan waktu agar konsistensi hadir tepat waktu semakin baik.";
  if(absent>=3)return "Pertahankan komunikasi dan pendampingan agar konsistensi mengikuti pembiasaan semakin baik.";
  return "Pertahankan kebiasaan positif yang sudah terbentuk dan kembangkan penerapannya dalam kegiatan pembelajaran maupun kehidupan sehari-hari.";
}
function studentReport(studentId,from,to){
  const s=state.students.find(x=>x.id===studentId);
  if(!s)return null;
  const ops=effectiveOpportunities(from,to);
  const byDim={};
  state.dimensions.forEach(d=>byDim[d.id]={dim:d,total:0,weighted:0,evidence:0,H:0,T:0,S:0,I:0,A:0,programs:[]});
  const records=[];
  ops.forEach(o=>{
    const a=attFor(o.date,o.program.id,s.id);
    const links=state.programDpl.filter(x=>x.habit_program_id===o.program.id);
    links.forEach(link=>{
      const d=byDim[link.dpl_id]; if(!d)return;
      d.total++;
      const key=a?.status==="HADIR"?"H":a?.status==="TERLAMBAT"?"T":a?.status==="SAKIT"?"S":a?.status==="IZIN"?"I":a?.status==="ALFA"?"A":null;
      if(key){ d.evidence++; d[key]++; d.weighted += CHARACTER_ATTENDANCE_WEIGHT[a.status] ?? 0; }
      const existing=d.programs.find(p=>p.id===o.program.id);
      if(existing) existing.count++;
      else d.programs.push({id:o.program.id,name:o.program.name,weekday:o.program.weekday,count:1});
    });
    if(a)records.push({date:o.date,program:o.program,status:a.status});
  });
  Object.values(byDim).forEach(x=>{
    if(!x.evidence){x.score=null;x.level="Belum cukup data";return;}
    const raw=(x.weighted/x.total)*4;
    x.score=Math.max(1,Math.min(4,Math.round(raw*10)/10));
    x.level=x.score<1.75?"Perlu Bimbingan":x.score<2.5?"Cukup":x.score<3.5?"Baik":"Sangat Baik";
    x.description=characterDescription(x);
  });
  return {student:s,byDim,records,ops};
}
function raporStudentsForClass(classId=""){

}
function raporPrintStudentOptions(value="",classId=""){

function raporPrintTargets(){

}

function getAcademicYearForDate(dateStr=todayISO()){
  const d=new Date(dateStr+"T00:00:00");
  const y=d.getFullYear(), m=d.getMonth()+1;
  return m>=7 ? `${y}/${y+1}` : `${y-1}/${y}`;
}
function academicYearParts(ay){
  const m=String(ay||"").match(/^(\d{4})\/(\d{4})$/);
  if(!m)return null;
  return {startYear:Number(m[1]),endYear:Number(m[2])};
}
function academicYearOptions(selected=""){
  const current=getAcademicYearForDate();
  const parts=academicYearParts(current);
  const years=[];
  if(parts){
    for(let i=-2;i<=2;i++) years.push(`${parts.startYear+i}/${parts.endYear+i}`);
  }
  return years.map(y=>`<option value="${y}" ${y===selected?"selected":""}>${y}</option>`).join("");
}
function monthPeriodOptions(ay,selected=""){
  const p=academicYearParts(ay); if(!p)return `<option value="">Pilih tahun ajaran terlebih dahulu</option>`;
  const arr=[];
  for(let i=0;i<12;i++){
    const d=new Date(p.startYear,6+i,1);
    const key=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;
    const label=d.toLocaleDateString("id-ID",{month:"long",year:"numeric"});
    arr.push(`<option value="${key}" ${key===selected?"selected":""}>${label}</option>`);
  }
  return arr.join("");
}
function setRaporPeriod(type,academicYear,key){
  state.raporPeriodType=type;
  state.raporAcademicYear=academicYear||getAcademicYearForDate();
  state.raporPeriodKey=key||"";
  const p=academicYearParts(state.raporAcademicYear);
  if(!p)return;
  if(type==="semester_ganjil"){
    state.raporFrom=`${p.startYear}-07-01`;
    state.raporTo=`${p.startYear}-12-31`;
  }else if(type==="semester_genap"){
    state.raporFrom=`${p.endYear}-01-01`;
    state.raporTo=`${p.endYear}-06-30`;
  }else if(type==="month" && /^\d{4}-\d{2}$/.test(state.raporPeriodKey)){
    const [y,m]=state.raporPeriodKey.split("-").map(Number);
    state.raporFrom=`${y}-${String(m).padStart(2,"0")}-01`;
    state.raporTo=localISO(new Date(y,m,0));
  }
}
function ensureRaporPeriod(){
  if(!state.raporAcademicYear)state.raporAcademicYear=getAcademicYearForDate(state.raporFrom||todayISO());
  if(!state.raporPeriodKey){
    if(state.raporPeriodType==="month") state.raporPeriodKey=(state.raporFrom||todayISO()).slice(0,7);
    else state.raporPeriodKey=state.raporPeriodType;
  }
  setRaporPeriod(state.raporPeriodType,state.raporAcademicYear,state.raporPeriodKey);
}
function raporPeriodLabel(){
  ensureRaporPeriod();
  const ay=state.raporAcademicYear;
  if(state.raporPeriodType==="semester_ganjil")return `Semester Ganjil ${ay} (Juli–Desember ${academicYearParts(ay).startYear})`;
  if(state.raporPeriodType==="semester_genap")return `Semester Genap ${ay} (Januari–Juni ${academicYearParts(ay).endYear})`;
  if(/^\d{4}-\d{2}$/.test(state.raporPeriodKey)){
    const [y,m]=state.raporPeriodKey.split("-").map(Number);
    return `${new Date(y,m-1,1).toLocaleDateString("id-ID",{month:"long"})} ${y} · ${ay}`;
  }
  return ay;
}

        <table class="report-table"><tr><th>Dimensi Profil Lulusan</th><th>Capaian</th><th>Deskripsi Perkembangan</th></tr>${Object.values(r.byDim).map(x=>`<tr><td><b>${esc(x.dim.name)}</b></td><td class="center">${x.score!=null?`${x.score.toFixed(1)}<br><small>${esc(x.level)}</small>`:"—<br><small>Belum cukup data</small>"}</td><td>${esc(x.description||"Belum cukup data untuk menggambarkan perkembangan pada dimensi ini.")}</td></tr>`).join("")}</table>
        <h3 class="report-section">2. Bukti Kehadiran pada Kegiatan Pembiasaan</h3>
        <table class="report-table compact"><tr><th>Pembiasaan</th><th>Dimensi Profil Lulusan</th><th>H</th><th>T</th><th>S</th><th>I</th><th>A</th></tr>${programs.map(p=>{const c={H:0,T:0,S:0,I:0,A:0};(r.records||[]).filter(x=>x.program.id===p.id).forEach(x=>c[x.status==="HADIR"?"H":x.status==="TERLAMBAT"?"T":x.status==="SAKIT"?"S":x.status==="IZIN"?"I":"A"]++);const dims=state.programDpl.filter(x=>x.habit_program_id===p.id).map(x=>state.dimensions.find(d=>d.id===x.dpl_id)?.name).filter(Boolean).join(" + ");return `<tr><td>${esc(p.name)}</td><td>${esc(dims||"-")}</td><td>${c.H}</td><td>${c.T}</td><td>${c.S}</td><td>${c.I}</td><td>${c.A}</td></tr>`}).join("")}</table>
        <div class="report-note"><b>Catatan Penguatan</b><p>${esc(characterFollowUp(r))}</p></div>
        <div class="sign"><div>Mengetahui,<br>Kepala Sekolah<br><br><br><b>${esc(school.principal_name||"")}</b>${school.principal_nip?`<br>NIP. ${esc(school.principal_nip)}`:""}</div><div>Mengetahui,<br>Kesiswaan<br><br><br><b>${esc(school.kesiswaan_name||"")}</b>${school.kesiswaan_nip?`<br>NIP/NIK. ${esc(school.kesiswaan_nip)}`:""}</div></div>
      </section>`;
    }).join("");
    content=reportPages;
  }
  const win=window.open("","_blank");
  if(!win){toast("Popup diblokir browser.");return;}
  const commonKop = type === "character" ? "" : `<div class="kop"><h1>${esc((school.school_name||"SMKS GRAFIKA").toUpperCase())}</h1><p>${esc(school.address||"")}</p><p>NPSN ${esc(school.npsn||"")}</p></div>`;
  win.document.write(`<html><head><title>${title}</title><style>@page{size:A4;margin:12mm}body{font-family:Arial,sans-serif;font-size:10px;color:#111}h2{text-align:center;font-size:16px;margin:4px}.kop{text-align:center;border-bottom:2px solid #111;padding-bottom:8px;margin-bottom:12px}.kop h1{font-size:15px;margin:0}.kop p{margin:2px;font-size:9px}table{width:100%;border-collapse:collapse;margin-top:10px}th,td{border:1px solid #222;padding:5px;font-size:8px}th{background:#eee}.report-kop{display:flex;gap:14px;align-items:center;border-bottom:3px solid #1e4fbf;padding-bottom:10px}.report-logo{width:58px;height:58px;object-fit:contain}.report-kop h1{font-size:18px;margin:0}.report-kop p{margin:2px 0;font-size:10px}.report-title{text-align:center;font-size:15px;margin:14px 0 10px}.student-info{display:grid;grid-template-columns:1fr 1fr 1fr;border:1px solid #d5d9e2}.student-info div{padding:6px 8px;border-right:1px solid #d5d9e2}.student-info div:last-child{border-right:0}.student-info b{display:block;font-size:9px;color:#667085}.student-info span{font-size:10px}.report-summary,.report-note{background:#f5f8ff;border-left:4px solid #2b63c6;padding:8px 10px;margin:10px 0}.report-summary p,.report-note p{margin:4px 0;font-size:10px;line-height:1.45}.report-section{font-size:12px;margin:12px 0 5px}.report-table{width:100%;border-collapse:collapse}.report-table th,.report-table td{border:1px solid #cfd5df;padding:5px 6px;font-size:9px;vertical-align:top}.report-table th{background:#eef4ff}.report-table .center{text-align:center}.report-table.compact th,.report-table.compact td{font-size:9px;text-align:center}.report-table.compact th:nth-child(1),.report-table.compact td:nth-child(1),.report-table.compact th:nth-child(2),.report-table.compact td:nth-child(2){text-align:left}.sign{display:flex;justify-content:space-between;margin-top:35px;text-align:center}.sign>div{width:40%}.page-break{page-break-after:always;break-after:page}.character-page{min-height:260mm;box-sizing:border-box}@media print{body{print-color-adjust:exact}.character-page{break-inside:avoid}}</style></head><body>${commonKop}${content}<script>window.onload=()=>window.print()<\/script></body></html>`);
  win.document.close();
}

  const compact=localStorage.getItem("kesiswaan_sidebar_collapsed")==="1";
  document.getElementById("appRoot")?.classList.toggle("sidebar-collapsed",compact);
  document.getElementById("sidebar")?.classList.toggle("collapsed",compact);
}
