function esc(v){
  return String(v ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
  }[c]));
}
function initials(name){
  return String(name||"??").split(/\s+/).filter(Boolean).slice(0,2).map(x=>x[0]).join("").toUpperCase();
}
function todayISO(){
  const d=new Date(); return localISO(d);
}
function localISO(d){
  const x=new Date(d); x.setMinutes(x.getMinutes()-x.getTimezoneOffset());
  return x.toISOString().slice(0,10);
}
function mondayOf(date){
  const d=new Date(date); d.setHours(0,0,0,0);
  const day=d.getDay() || 7; d.setDate(d.getDate()-day+1);
  return localISO(d);
}
function addDays(iso,n){
  const d=new Date(iso+"T00:00:00"); d.setDate(d.getDate()+n); return localISO(d);
}
function firstDayOfMonth(){
  const d=new Date(); d.setDate(1); return localISO(d);
}
function fmtDate(v){
  if(!v)return "-";
  const d=new Date(v+"T00:00:00");
  return d.toLocaleDateString("id-ID",{day:"2-digit",month:"2-digit",year:"numeric"});
}
function dayName(weekday){
  return ["","Senin","Selasa","Rabu","Kamis","Jumat","Sabtu","Minggu"][Number(weekday)] || "-";
}
function statusBadge(s){
  const m={Selesai:"badge-green",Dipantau:"badge-orange",Aktif:"badge-green",HADIR:"badge-green",TERLAMBAT:"badge-orange",SAKIT:"badge-blue",IZIN:"badge-purple",ALFA:"badge-red"};
  return `<span class="badge ${m[s]||"badge-gray"}">${esc(s)}</span>`;
}
function toast(msg){
  const t=document.getElementById("toast"); t.textContent=msg; t.classList.add("show");
  clearTimeout(window.__toast); window.__toast=setTimeout(()=>t.classList.remove("show"),2600);
}
function toggleDesktopSidebar(){
  const app=document.getElementById("appRoot"), side=document.getElementById("sidebar");
  app.classList.toggle("sidebar-collapsed"); side.classList.toggle("collapsed");
  localStorage.setItem("kesiswaan_sidebar_collapsed", side.classList.contains("collapsed")?"1":"0");
}
function toggleTopMenu(){ toast("Menu akun: gunakan tombol Keluar di bagian bawah menu."); }
function runGlobalSearch(){
  const q=(document.getElementById("globalSearch")?.value||"").trim().toLowerCase();
  if(!q)return;
  if(state.tab==="siswa"){ renderStudentTable(); return; }
  if(["siswa","student","nis"].some(x=>q.includes(x))) { state.tab="siswa"; render(); setTimeout(()=>{const x=document.getElementById("studentSearch");if(x){x.value=q;renderStudentTable();}},0); return; }
  if(q.includes("terlambat")){state.tab="terlambat";render();return;}
  if(q.includes("pelanggaran")){state.tab="rekapPelanggaran";render();return;}
  toast("Gunakan pencarian untuk nama/NIS atau kata kunci menu.");
}
function toggleSidebar(){
  document.getElementById("sidebar").classList.toggle("open");
  document.getElementById("overlay").classList.toggle("show");
}
function closeModal(){document.getElementById("modal").classList.remove("show");state.modalSave=null;}
function openModal(title,body,onSave,label="Simpan Data"){
  document.getElementById("modalTitle").textContent=title;
  document.getElementById("modalBody").innerHTML=body;
  document.getElementById("modalSaveBtn").textContent=label;
  state.modalSave=onSave;
  document.getElementById("modal").classList.add("show");
}
async function saveModal(){
  if(!state.modalSave)return closeModal();
  const fn=state.modalSave; state.modalSave=null;
  try{ await fn(); closeModal(); }catch(e){console.error(e);toast(e.message||"Gagal menyimpan data");}
}
function layout(title,desc,body,actions=""){
  document.getElementById("crumb").textContent=title;
  return `<div class="page-head"><div><h1>${title}</h1><p>${desc}</p></div><div class="head-actions">${actions}</div></div>${body}`;
}
function stat(label,value,note,ico,cl){
  return `<div class="card stat"><div><div class="stat-label">${label}</div><div class="stat-value">${value}</div><div class="stat-note">${note}</div></div><div class="stat-icon ${cl}">${ico}</div></div>`;
}
function selectOptions(items,value="",placeholder="Semua"){
  return `<option value="">${placeholder}</option>`+items.map(x=>{
    const id=x.id, name=x.name||x.full_name||x.title||"";
    return `<option value="${esc(id)}" ${String(id)===String(value)?"selected":""}>${esc(name)}</option>`;
  }).join("");
}
function classOptions(value=""){
  return selectOptions(state.classes,value,"Semua Kelas");
}
function studentOptions(value=""){
  return selectOptions(state.students,value,"Semua Siswa");
}
function programOptions(value=""){
  return selectOptions(state.programs,value,"Semua Pembiasaan");
}
function statusOptions(value=""){
  return `<option value="">Semua Status</option>${["Selesai","Dipantau"].map(x=>`<option ${x===value?"selected":""}>${x}</option>`).join("")}`;
}

async function loadAll(){
  state.loading=true; renderLoading();
  const [
    school, classes, students, programs, dims, pdpl, attendance,
    violations, vtypes, followups, calendar
  ] = await Promise.all([
    supabaseClient.from("school_settings").select("*").limit(1).maybeSingle(),
    supabaseClient.from("classes").select("id,name,grade,major,homeroom_teacher_id,is_active").eq("is_active",true).order("name"),
    supabaseClient.from("students").select("id,auth_user_id,nis,nisn,full_name,class_id,gender,is_active,classes(id,name,grade,major)").eq("is_active",true).order("full_name"),
    supabaseClient.from("habit_programs").select("id,name,code,weekday,description,start_time,end_time,is_active").eq("is_active",true).order("weekday").order("start_time"),
    supabaseClient.from("dpl_dimensions").select("*").eq("is_active",true).order("sort_order"),
    supabaseClient.from("habit_program_dpl").select("*"),
    supabaseClient.from("habit_attendance").select("id,attendance_date,habit_program_id,student_id,status,notes,recorded_by"),
    supabaseClient.from("student_violations").select("id,student_id,violation_type_id,violation_date,points,description,status,recorded_by,students(id,nis,full_name,class_id,classes(name)),violation_types(id,name,points)").order("violation_date",{ascending:false}),
    supabaseClient.from("violation_types").select("*").order("name"),
    supabaseClient.from("violation_follow_ups").select("id,violation_id,follow_up_date,actor_id,action_type,action_description,notes,status,created_at,recorded_by").order("follow_up_date",{ascending:false}),
    supabaseClient.from("school_calendar").select("*").order("calendar_date")
  ]);
  const results=[school,classes,students,programs,dims,pdpl,attendance,violations,vtypes,followups,calendar];
  const bad=results.find(r=>r.error);
  if(bad) throw bad.error;

  state.school=school.data||null;
  state.classes=classes.data||[];
  state.students=students.data||[];
  state.programs=programs.data||[];
  state.dimensions=dims.data||[];
  state.programDpl=pdpl.data||[];
  state.attendance=attendance.data||[];
  state.violations=violations.data||[];
  state.violationTypes=vtypes.data||[];
  state.followUps=followups.data||[];
  state.calendar=calendar.data||[];
  state.loading=false;
}

function renderLoading(){
  const p=document.getElementById("page");
  if(p)p.innerHTML=`<div class="card empty">Memuat data dari Supabase...</div>`;
}

function navRender(){
  const nav=document.getElementById("nav");
  const role=state.profile?.role||"";
  const allowed=(tab)=>{
    if(role==="superadmin"||role==="kesiswaan")return true;
    if(role==="guru")return ["dashboard","presensi","terlambat","rekapPresensi","siswa","pelanggaran","tindaklanjut","rekapPelanggaran","rapor","kalender"].includes(tab);
    if(role==="siswa")return ["dashboard","rapor","rekapPresensi"].includes(tab);
    return false;
  };
  nav.innerHTML=MENU.map(g=>{
    const items=g.items.filter(x=>allowed(x[0]));
    if(!items.length)return "";
    return `<div class="nav-title">${g.group}</div>`+items.map(x=>
      `<button class="${state.tab===x[0]?"active":""}" onclick="go('${x[0]}')"><span class="ico">${x[1]}</span>${x[2]}</button>`
    ).join("");
  }).join("");
}
function updateIdentity(){
  const p=state.profile||{};
  const school=state.school||{};
  document.getElementById("brandSchool").textContent=school.school_name||"SMKS Grafika";
  document.getElementById("sideName").textContent=p.full_name||p.email||"Pengguna";
  document.getElementById("sideRole").textContent=(p.role||"").toUpperCase();
  document.getElementById("sideAvatar").textContent=initials(p.full_name||p.email);
  document.getElementById("topAvatar").textContent=initials(p.full_name||p.email);
  const topName=document.getElementById("topName"),topEmail=document.getElementById("topEmail");
  if(topName)topName.textContent=p.full_name||"Pengguna";
  if(topEmail)topEmail.textContent=p.email||"";
  if(school.logo_url)document.getElementById("brandLogo").innerHTML=`<img src="${esc(school.logo_url)}" style="width:100%;height:100%;object-fit:contain;border-radius:12px">`;
}
function render(){
  navRender();
  const fn=views[state.tab]||views.dashboard;
  document.getElementById("page").innerHTML=fn();
  if(window.innerWidth<=780) {
    document.getElementById("sidebar").classList.remove("open");
    document.getElementById("overlay").classList.remove("show");
  }
}
function go(tab){state.tab=tab;render();}

async function boot(){
  const {data:{session}}=await supabaseClient.auth.getSession();
  if(!session){showLogin();return;}
  const {data:profile,error}=await supabaseClient.from("profiles")
    .select("id,full_name,email,role,is_active").eq("id",session.user.id).single();
  if(error||!profile||!profile.is_active){
    await supabaseClient.auth.signOut();
    showLogin(error?.message||"Profil pengguna tidak ditemukan atau tidak aktif.");
    return;
  }
  state.user=session.user; state.profile=profile;
  document.getElementById("appRoot").style.display="";
  applySidebarPreference();
  document.getElementById("loginRoot").innerHTML="";
  try{await loadAll();updateIdentity();render();}
  catch(e){console.error(e);toast("Gagal memuat data: "+e.message);render();}
}

/* ---------------- Unified attendance ---------------- */
function weekDates(){
  return Array.from({length:5},(_,i)=>addDays(state.weekStart,i));
}
function programForDate(date){
  const wd=new Date(date+"T00:00:00").getDay()||7;
  return state.programs.filter(p=>Number(p.weekday)===wd);
}
function calendarStatus(date){
  return state.calendar.find(x=>x.calendar_date===date)?.status||"NORMAL";
}
function studentsForClass(classId){
  return state.students.filter(s=>!classId||s.class_id===classId);
}
function attFor(date,programId,studentId){
  return state.attendance.find(x=>x.attendance_date===date&&x.habit_program_id===programId&&x.student_id===studentId);
}
function draftKey(date,pid,sid){return `${date}__${pid}__${sid}`;}
function getDraft(date,pid,sid){
  const k=draftKey(date,pid,sid);
  if(Object.prototype.hasOwnProperty.call(state.attendanceDraft,k)){
    return state.attendanceDraft[k];
  }
  const existing=attFor(date,pid,sid);
  if(existing)return {status:existing.status};
  return {status:"HADIR"};
}
function setDraft(date,pid,sid,status,extra={}){
  state.attendanceDraft[draftKey(date,pid,sid)]={status,...extra};
}
function statusClass(status){
  return status==="HADIR"?"h":status==="TERLAMBAT"?"t":status==="SAKIT"?"s":status==="IZIN"?"i":"a";
}
function statusLabel(status){
  return {HADIR:"H - Hadir",TERLAMBAT:"T - Terlambat",SAKIT:"S - Sakit",IZIN:"I - Izin",ALFA:"A - Alfa"}[status]||"—";
}
function attendanceCell(date,pid,sid){
  const future=date>todayISO(), unavailable=calendarStatus(date)!=="NORMAL";
  const d=getDraft(date,pid,sid);
  if(unavailable){
    const label=calendarStatus(date)==="LIBUR"?"☒ Libur":"⊘ Ditiadakan";
    return `<div class="att-cell"><button class="att-status locked" disabled>${label}</button></div>`;
  }
  if(future){
    return `<div class="att-cell"><button class="att-status locked" disabled>🔒 Belum tersedia</button></div>`;
  }
  const c=statusClass(d.status);
  return `<div class="att-cell"><button class="att-status ${c}" onclick="chooseAttendance('${date}','${pid}','${sid}','${d.status}')">${statusLabel(d.status)}</button></div>`;
}

async function chooseAttendance(date,pid,sid,status,clickedButton){

  // sehingga ketika operator memilih siswa paling bawah terasa "meloncat".
  setDraft(date,pid,sid,status,{attendance_time:null,late_minutes:0,late_notes:null});

async function saveAttendanceDraft(){
  const btn=document.getElementById("saveAttendanceBtn");
  if(btn){btn.disabled=true;btn.textContent="Menyimpan...";}

  try{
    const classId=state.attendanceClass;
    if(!classId)throw new Error("Pilih kelas terlebih dahulu.");
    if(!state.user?.id)throw new Error("Sesi pengguna tidak ditemukan. Silakan login kembali.");

    /*
      PENTING:
      habit_attendance memiliki UNIQUE constraint pada:
      attendance_date + habit_program_id + student_id.

      Jangan lagi membagi data menjadi UPDATE lalu INSERT berdasarkan
      state.attendance di browser. State bisa saja belum sinkron dengan
      database dan menyebabkan INSERT terhadap record yang sebenarnya
      sudah ada.

      Kita refresh data minggu ini terlebih dahulu, lalu gunakan UPSERT
      dengan conflict target yang sama persis dengan UNIQUE constraint.
      Hasilnya:
        - record belum ada  -> INSERT
        - record sudah ada  -> UPDATE
      dan penyimpanan dapat diulang tanpa duplicate-key error.
    */
    await reloadAttendance();

    const students=studentsForClass(classId);
    const rows=[];
    const rowMap=new Map();

    for(const date of weekDates()){
      // Tanggal mendatang dan tanggal LIBUR/DITIADAKAN bukan kesempatan presensi.
      if(date>todayISO() || calendarStatus(date)!=="NORMAL") continue;

      const programs=programForDate(date);
      for(const program of programs){
        for(const student of students){
          const draft=getDraft(date,program.id,student.id);
          if(!draft?.status) continue;

          const row={
            attendance_date:date,
            habit_program_id:program.id,
            student_id:student.id,
            status:draft.status,
            notes:draft.notes ?? null,
            recorded_by:state.user.id
          };

          // Lindungi upsert dari duplicate rows yang mungkin terbentuk
          // di sisi browser: satu kombinasi hanya boleh satu baris.
          const key=`${date}__${program.id}__${student.id}`;
          rowMap.set(key,row);
        }
      }
    }

    rows.push(...rowMap.values());
    if(!rows.length)throw new Error("Tidak ada presensi yang dapat disimpan.");

    const {error}=await supabaseClient
      .from("habit_attendance")
      .upsert(rows,{
        onConflict:"attendance_date,habit_program_id,student_id",
        ignoreDuplicates:false
      });

    if(error)throw error;

    // Ambil kembali data dari Supabase agar tampilan selalu mencerminkan
    // database setelah UPSERT berhasil.
    state.attendanceDraft={};
    await reloadAttendance();
    render();
    toast(`Presensi ${students.length} siswa berhasil disimpan.`);
  }catch(e){
    console.error("Gagal menyimpan presensi:",e);
    const message=String(e?.message||"");
    if(message.toLowerCase().includes("duplicate key") || message.toLowerCase().includes("unique constraint")){
      toast("Ada data presensi yang sudah tersimpan. Sistem mencoba menyinkronkan ulang; silakan klik Simpan sekali lagi.");
      try{await reloadAttendance();render();}catch(syncError){console.error("Gagal sinkronisasi:",syncError);}
    }else{
      toast(message || "Gagal menyimpan presensi.");
    }
    if(btn){btn.disabled=false;btn.textContent="✓ Simpan Presensi";}
  }
}

/* ---------------- Attendance recap ---------------- */
function effectiveOpportunities(from,to,programId=""){
  const result=[];
  for(let d=from;d<=to;d=addDays(d,1)){
    if(d>todayISO())break;
    const wd=new Date(d+"T00:00:00").getDay()||7;
    if(wd>5)continue;
    if(calendarStatus(d)!=="NORMAL")continue;
    const ps=state.programs.filter(p=>Number(p.weekday)===wd&&(!programId||p.id===programId));
    ps.forEach(p=>result.push({date:d,program:p}));
  }
  return result;
}
function recapRows(){
  const f=state.recapFilters;
  const opportunities=effectiveOpportunities(f.from,f.to,f.programId);
  const students=studentsForClass(f.classId).filter(s=>!f.studentId||s.id===f.studentId);
  return students.map(s=>{
    const row={student:s,H:0,T:0,S:0,I:0,A:0,opportunities:0};
    const ops=opportunities;
    row.opportunities=ops.length;
    ops.forEach(o=>{
      const a=attFor(o.date,o.program.id,s.id);
      const st=a?.status;
      if(st==="HADIR")row.H++;
      else if(st==="TERLAMBAT")row.T++;
      else if(st==="SAKIT")row.S++;
      else if(st==="IZIN")row.I++;
      else if(st==="ALFA")row.A++;
    });
    row.present=row.H+row.T;
    row.absent=row.S+row.I+row.A;
    row.attendancePct=row.opportunities?Math.round(row.present/row.opportunities*10000)/100:0;
    row.absencePct=row.opportunities?Math.round(row.absent/row.opportunities*10000)/100:0;
    return row;
  });
}

function normalizeClassName(v){
  return String(v||"")
    .toUpperCase()
    .replace(/[‐‑‒–—−]/g,"-")
    .replace(/[^A-Z0-9]+/g,"")
    .trim();
}
function findClassForImport(className){
  const raw=String(className||"").trim();
  if(!raw)return null;
  const exact=state.classes.find(c=>String(c.name||"").trim().toLowerCase()===raw.toLowerCase());
  if(exact)return exact;

  const n=normalizeClassName(raw);
  const normalized=state.classes.find(c=>normalizeClassName(c.name)===n);
  if(normalized)return normalized;

  // Common school notation: "XTG" ↔ "X TG" ↔ "X-TG".
  const gradeMajor=/^(XII|XI|X|IX|VIII|VII)(.*)$/i.exec(n);
  if(gradeMajor){
    const grade=gradeMajor[1].toUpperCase(), major=gradeMajor[2];
    const candidate=state.classes.find(c=>{
      const cn=normalizeClassName(c.name);
      return cn.startsWith(grade) && cn.slice(grade.length)===major;
    });
    if(candidate)return candidate;
  }
  return null;
}
function classSelectForImport(raw){
  const matched=findClassForImport(raw);
  if(matched)return statusBadge("Aktif");
  const key=String(raw||"");

async function importStudents(){
  if(!state.importRows.length)throw new Error("Belum ada file atau data Excel.");

  const rows=state.importRows;
  const errors=[];

  // =========================================================
  // MASTER KELAS:
  // Tidak perlu diinput terlebih dahulu di aplikasi.
  // Nama kelas dari Excel otomatis menjadi master pada
  // public.classes jika belum tersedia.
  // =========================================================
  const uniqueClassNames=[...new Set(
    rows.map(r=>String(r.class_name||"").trim()).filter(Boolean)
  )];

  if(!uniqueClassNames.length){
    throw new Error("Kolom Kelas tidak ditemukan atau seluruhnya kosong.");
  }

  // Pastikan kelas yang sudah ada dimanfaatkan terlebih dahulu.
  const classMap=new Map();
  state.classes.forEach(c=>{
    classMap.set(normalizeClassName(c.name),c);
  });

  // Buat master kelas yang belum ada.
  const newClasses=uniqueClassNames
    .filter(name=>!classMap.has(normalizeClassName(name)))
    .map(name=>({
      name:name,
      grade:deriveGrade(name),
      major:deriveMajor(name),
      is_active:true
    }));

  if(newClasses.length){
    const {data,error}=await supabaseClient
      .from("classes")
      .insert(newClasses)
      .select("id,name,grade,major,is_active");

    if(error)throw new Error(
      "Gagal membuat Master Kelas otomatis: "+error.message
    );

    (data||[]).forEach(c=>{
      classMap.set(normalizeClassName(c.name),c);
    });
  }

  // Ambil ulang master kelas agar ID yang baru dibuat pasti tersedia.
  const {data:allClasses,error:classError}=await supabaseClient
    .from("classes")
    .select("id,name,grade,major,is_active")
    .eq("is_active",true);

  if(classError)throw classError;

  (allClasses||[]).forEach(c=>{
    classMap.set(normalizeClassName(c.name),c);
  });

  const payload=rows.map((r,i)=>{
    const className=String(r.class_name||"").trim();
    const normalized=normalizeClassName(className);

    let c=classMap.get(normalized);

    // Fallback ke pemetaan manual jika memang diperlukan.
    if(!c && state.importClassMap[className]){
      c=(allClasses||[]).find(x=>x.id===state.importClassMap[className]);
    }

    if(!r.nis||!r.full_name||!className){
      errors.push(`Baris ${i+2}: NIS, nama, dan kelas wajib.`);
      return null;
    }

    if(!c){
      errors.push(`Baris ${i+2}: kelas "${className}" gagal dibuat/ditemukan.`);
      return null;
    }

    return {
      nis:r.nis,
      nisn:r.nisn||null,
      full_name:r.full_name,
      class_id:c.id,
      gender:r.gender||null,
      is_active:true
    };
  }).filter(Boolean);

  if(errors.length){
    throw new Error(
      errors.slice(0,8).join(" | ")+
      (errors.length>8?` | dan ${errors.length-8} error lainnya.`:"")
    );
  }

  const {error}=await supabaseClient
    .from("students")
    .upsert(payload,{onConflict:"nis"});

  if(error)throw error;

  state.importRows=[];
  state.importClassMap={};

  await loadAll();
  updateIdentity();
  render();

  toast(
    `${payload.length} siswa berhasil diimport. `+
    `${newClasses.length} master kelas baru dibuat otomatis.`
  );
}

// XTG -> X, TG
// X TG -> X, TG
// XI DKV 1 -> XI, DKV 1
// XII RPL 2 -> XII, RPL 2
function deriveGrade(className){
  const s=String(className||"").trim().toUpperCase();
  const m=s.match(/^(XII|XI|X|IX|VIII|VII)/);
  return m?m[1]:null;
}

function deriveMajor(className){
  const s=String(className||"").trim().toUpperCase();
  const grade=deriveGrade(s);
  if(!grade)return null;

  let rest=s.slice(grade.length).trim();
  rest=rest.replace(/^[\s\-]+/,"").trim();

  return rest||null;
}

/* ---------------- Rapor ---------------- */
function characterDescription(x){
  if(!x.evidence) return "Belum cukup data untuk menggambarkan perkembangan pada dimensi ini.";
  const late=x.T||0, absent=(x.S||0)+(x.I||0)+(x.A||0);
  const level=x.level;
  const dim=(x.dim?.name||"").toLowerCase();
  let text="";
  if(dim.includes("keimanan")) text=`Menunjukkan perkembangan ${level.toLowerCase()} dalam mengikuti pembiasaan keagamaan dan membangun konsistensi sikap positif dalam kegiatan sekolah.`;
  else if(dim.includes("kewargaan")) text=`Menunjukkan perkembangan ${level.toLowerCase()} dalam mengikuti kegiatan kebangsaan, menjaga ketertiban, dan menghargai aturan serta kegiatan bersama.`;
  else if(dim.includes("penalaran kritis")) text=`Menunjukkan perkembangan ${level.toLowerCase()} dalam mengikuti kegiatan yang mendorong kemampuan memahami informasi, berpikir, dan memberikan tanggapan.`;
  else if(dim.includes("kreativitas")) text=`Menunjukkan perkembangan ${level.toLowerCase()} dalam mengeksplorasi gagasan dan berpartisipasi dalam kegiatan yang memberi ruang untuk menghasilkan ide atau karya.`;
  else if(dim.includes("kolaborasi")) text=`Menunjukkan perkembangan ${level.toLowerCase()} dalam bekerja sama, berpartisipasi, dan menjalankan peran dalam kegiatan bersama.`;
  else if(dim.includes("kemandirian")) text=`Menunjukkan perkembangan ${level.toLowerCase()} dalam mengikuti kegiatan secara bertanggung jawab dan membangun kebiasaan menyelesaikan tugas atau aktivitas secara mandiri.`;
  else if(dim.includes("kesehatan")) text=`Menunjukkan perkembangan ${level.toLowerCase()} dalam mengikuti kegiatan yang mendukung kebugaran, kesehatan, dan kebiasaan hidup sehat.`;
  else if(dim.includes("komunikasi")) text=`Menunjukkan perkembangan ${level.toLowerCase()} dalam menyampaikan tanggapan, mengikuti interaksi, dan berpartisipasi dalam komunikasi yang positif.`;
  else text=`Menunjukkan perkembangan ${level.toLowerCase()} melalui partisipasi dalam kegiatan pembiasaan yang terhubung dengan dimensi ini.`;
  if(late>=2) text += " Konsistensi kedisiplinan waktu masih perlu diperkuat.";
  if(absent>0 && late<2) text += " Konsistensi mengikuti kegiatan perlu terus dipertahankan dan diperkuat.";
  if(late===0 && absent===0) text += " Konsistensi mengikuti kegiatan pada periode ini sudah baik dan perlu dipertahankan.";
  return text;
}
function characterStrength(r){
  const scored=Object.values(r.byDim).filter(x=>x.score!=null);
  if(!scored.length)return "Belum cukup data untuk menyusun ringkasan perkembangan karakter.";
  const avg=scored.reduce((a,x)=>a+x.score,0)/scored.length;
  const level=avg<1.75?"Perlu Bimbingan":avg<2.5?"Cukup":avg<3.5?"Baik":"Sangat Baik";
  const top=scored.slice().sort((a,b)=>b.score-a.score).slice(0,2).map(x=>x.dim.name);
  return `Berdasarkan evidence kegiatan pembiasaan pada periode ini, perkembangan karakter peserta didik berada pada kategori ${level}. Perkembangan yang paling menonjol terlihat pada ${top.join(" dan ")}.`;
}
function characterFollowUp(r){
  const scored=Object.values(r.byDim).filter(x=>x.score!=null);
  const late=scored.reduce((a,x)=>a+x.T,0), absent=scored.reduce((a,x)=>a+x.S+x.I+x.A,0);
  if(!scored.length)return "Data pembiasaan perlu dilengkapi agar perkembangan karakter dapat dideskripsikan dengan lebih akurat.";
  if(late>=3)return "Pertahankan partisipasi dalam pembiasaan dan berikan penguatan pada kedisiplinan waktu agar konsistensi hadir tepat waktu semakin baik.";
  if(absent>=3)return "Pertahankan komunikasi dan pendampingan agar konsistensi mengikuti pembiasaan semakin baik.";
  return "Pertahankan kebiasaan positif yang sudah terbentuk dan kembangkan penerapannya dalam kegiatan pembelajaran maupun kehidupan sehari-hari.";
}
function studentReport(studentId,from,to){
  const s=state.students.find(x=>x.id===studentId);
  if(!s)return null;
  const ops=effectiveOpportunities(from,to);
  const byDim={};
  state.dimensions.forEach(d=>byDim[d.id]={dim:d,total:0,weighted:0,evidence:0,H:0,T:0,S:0,I:0,A:0,programs:[]});
  const records=[];
  ops.forEach(o=>{
    const a=attFor(o.date,o.program.id,s.id);
    const links=state.programDpl.filter(x=>x.habit_program_id===o.program.id);
    links.forEach(link=>{
      const d=byDim[link.dpl_id]; if(!d)return;
      d.total++;
      const key=a?.status==="HADIR"?"H":a?.status==="TERLAMBAT"?"T":a?.status==="SAKIT"?"S":a?.status==="IZIN"?"I":a?.status==="ALFA"?"A":null;
      if(key){ d.evidence++; d[key]++; d.weighted += CHARACTER_ATTENDANCE_WEIGHT[a.status] ?? 0; }
      const existing=d.programs.find(p=>p.id===o.program.id);
      if(existing) existing.count++;
      else d.programs.push({id:o.program.id,name:o.program.name,weekday:o.program.weekday,count:1});
    });
    if(a)records.push({date:o.date,program:o.program,status:a.status});
  });
  Object.values(byDim).forEach(x=>{
    if(!x.evidence){x.score=null;x.level="Belum cukup data";return;}
    const raw=(x.weighted/x.total)*4;
    x.score=Math.max(1,Math.min(4,Math.round(raw*10)/10));
    x.level=x.score<1.75?"Perlu Bimbingan":x.score<2.5?"Cukup":x.score<3.5?"Baik":"Sangat Baik";
    x.description=characterDescription(x);
  });
  return {student:s,byDim,records,ops};
}

function getAcademicYearForDate(dateStr=todayISO()){
  const d=new Date(dateStr+"T00:00:00");
  const y=d.getFullYear(), m=d.getMonth()+1;
  return m>=7 ? `${y}/${y+1}` : `${y-1}/${y}`;
}
function academicYearParts(ay){
  const m=String(ay||"").match(/^(\d{4})\/(\d{4})$/);
  if(!m)return null;
  return {startYear:Number(m[1]),endYear:Number(m[2])};
}
function academicYearOptions(selected=""){
  const current=getAcademicYearForDate();
  const parts=academicYearParts(current);
  const years=[];
  if(parts){
    for(let i=-2;i<=2;i++) years.push(`${parts.startYear+i}/${parts.endYear+i}`);
  }
  return years.map(y=>`<option value="${y}" ${y===selected?"selected":""}>${y}</option>`).join("");
}
function monthPeriodOptions(ay,selected=""){
  const p=academicYearParts(ay); if(!p)return `<option value="">Pilih tahun ajaran terlebih dahulu</option>`;
  const arr=[];
  for(let i=0;i<12;i++){
    const d=new Date(p.startYear,6+i,1);
    const key=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;
    const label=d.toLocaleDateString("id-ID",{month:"long",year:"numeric"});
    arr.push(`<option value="${key}" ${key===selected?"selected":""}>${label}</option>`);
  }
  return arr.join("");
}
function setRaporPeriod(type,academicYear,key){
  state.raporPeriodType=type;
  state.raporAcademicYear=academicYear||getAcademicYearForDate();
  state.raporPeriodKey=key||"";
  const p=academicYearParts(state.raporAcademicYear);
  if(!p)return;
  if(type==="semester_ganjil"){
    state.raporFrom=`${p.startYear}-07-01`;
    state.raporTo=`${p.startYear}-12-31`;
  }else if(type==="semester_genap"){
    state.raporFrom=`${p.endYear}-01-01`;
    state.raporTo=`${p.endYear}-06-30`;
  }else if(type==="month" && /^\d{4}-\d{2}$/.test(state.raporPeriodKey)){
    const [y,m]=state.raporPeriodKey.split("-").map(Number);
    state.raporFrom=`${y}-${String(m).padStart(2,"0")}-01`;
    state.raporTo=localISO(new Date(y,m,0));
  }
}
function ensureRaporPeriod(){
  if(!state.raporAcademicYear)state.raporAcademicYear=getAcademicYearForDate(state.raporFrom||todayISO());
  if(!state.raporPeriodKey){
    if(state.raporPeriodType==="month") state.raporPeriodKey=(state.raporFrom||todayISO()).slice(0,7);
    else state.raporPeriodKey=state.raporPeriodType;
  }
  setRaporPeriod(state.raporPeriodType,state.raporAcademicYear,state.raporPeriodKey);
}
function raporPeriodLabel(){
  ensureRaporPeriod();
  const ay=state.raporAcademicYear;
  if(state.raporPeriodType==="semester_ganjil")return `Semester Ganjil ${ay} (Juli–Desember ${academicYearParts(ay).startYear})`;
  if(state.raporPeriodType==="semester_genap")return `Semester Genap ${ay} (Januari–Juni ${academicYearParts(ay).endYear})`;
  if(/^\d{4}-\d{2}$/.test(state.raporPeriodKey)){
    const [y,m]=state.raporPeriodKey.split("-").map(Number);
    return `${new Date(y,m-1,1).toLocaleDateString("id-ID",{month:"long"})} ${y} · ${ay}`;
  }
  return ay;
}

    </select></div>
    ${state.raporPrintMode==="student"?`<div class="field"><label>Nama Siswa</label><select class="select" ${!state.raporClassId?"disabled":""} onchange="state.raporPrintStudent=this.value;state.selectedRaporStudent=this.value;render()">${state.raporClassId?raporPrintStudentOptions(state.raporPrintStudent,state.raporClassId):`<option value="">Pilih kelas terlebih dahulu</option>`}</select></div>`:""}
    <div style="margin-left:auto;display:flex;align-items:end;gap:8px"><button class="btn btn-primary" onclick="printReport('character')">🖨 Cetak ${state.raporPrintMode==="student"?"Siswa":"Semua"}</button></div>
  </div>
  <div style="margin-top:9px;color:#70778a;font-size:9px">Periode cetak: <b>${esc(raporPeriodLabel())}</b>. Pilih <b>Kelas</b> terlebih dahulu. Untuk cetak satu siswa, pilih <b>Berdasarkan Nama</b> lalu pilih nama siswa.</div></div>
  ${!r?`<div class="card empty">Belum ada siswa pada kelas yang dipilih.</div>`:`<div class="card rapor-preview-card">
    <div class="rapor-preview-head"><div><span class="eyebrow">LAPORAN PERKEMBANGAN KARAKTER</span><h2>${esc(r.student.full_name)}</h2><p>${esc(className)} · ${esc(raporPeriodLabel())}</p></div><div class="score-puck"><strong>${Object.values(r.byDim).filter(x=>x.score!=null).length? (Object.values(r.byDim).filter(x=>x.score!=null).reduce((a,x)=>a+x.score,0)/Object.values(r.byDim).filter(x=>x.score!=null).length).toFixed(1):"—"}</strong><span>rata-rata</span></div></div>
    <div class="rapor-summary"><strong>Ringkasan Perkembangan</strong><p>${esc(characterStrength(r))}</p></div>
    <div class="section-title"><span>01</span> Perkembangan 8 Dimensi Profil Lulusan</div>
    <div class="dimension-report">${Object.values(r.byDim).map(x=>`<article class="dimension-card"><div class="dimension-top"><div><small>${esc(x.dim.code||"")}</small><h3>${esc(x.dim.name)}</h3></div><div class="level-pill">${esc(x.level)}</div></div><p>${esc(x.description||"Belum cukup data")}</p>${x.score!=null?`<div class="dimension-bottom"><span>Nilai perkembangan</span><strong>${x.score.toFixed(1)} / 4</strong></div>`:""}</article>`).join("")}</div>

    <div class="rapor-note"><strong>Catatan Penguatan</strong><p>${esc(characterFollowUp(r))}</p></div>
  </div>`}`);
};

async function saveSchoolSettings(){
  const payload={school_name:document.getElementById("ssName").value.trim(),npsn:document.getElementById("ssNpsn").value.trim()||null,address:document.getElementById("ssAddress").value.trim()||null,village:document.getElementById("ssVillage").value.trim()||null,district:document.getElementById("ssDistrict").value.trim()||null,city_regency:document.getElementById("ssCity").value.trim()||null,province:document.getElementById("ssProvince").value.trim()||null,principal_name:document.getElementById("ssPrincipal").value.trim()||null,principal_nip:document.getElementById("ssNip").value.trim()||null,kesiswaan_name:document.getElementById("ssKesiswaan").value.trim()||null,kesiswaan_nip:document.getElementById("ssKesiswaanNip").value.trim()||null,logo_url:document.getElementById("ssLogo").value.trim()||null,website:document.getElementById("ssWebsite").value.trim()||null,updated_by:state.user.id};
  let q=state.school?.id?supabaseClient.from("school_settings").update(payload).eq("id",state.school.id):supabaseClient.from("school_settings").insert(payload);
  const {error}=await q;if(error)throw error;await loadAll();updateIdentity();render();toast("Pengaturan tersimpan.");
}

function printReport(type){
  const old=document.body.innerHTML;
  const school=state.school||{};
  let title="Laporan Kesiswaan", content="";
  if(type==="late"){
    title="Rekap Keterlambatan";
    content=`<h2>REKAP KETERLAMBATAN</h2><p>Periode ${fmtDate(state.lateFilters.from)} s.d. ${fmtDate(state.lateFilters.to)}</p>
    <table>${getLateRows().map(x=>`<tr><td>${fmtDate(x.attendance_date)}</td><td>${esc(x.student?.nis)}</td><td>${esc(x.student?.full_name)}</td><td>${esc(state.classes.find(c=>c.id===x.student?.class_id)?.name||"")}</td><td>${esc(x.program?.name)}</td><td>TERLAMBAT</td></tr>`).join("")}</table>`;
  } else if(type==="recapAttendance"){
    title="Rekap Presensi";
    content=`<h2>REKAP PRESENSI</h2><p>Periode ${fmtDate(state.recapFilters.from)} s.d. ${fmtDate(state.recapFilters.to)}</p><table>${recapRows().map(r=>`<tr><td>${esc(r.student.nis)}</td><td>${esc(r.student.full_name)}</td><td>${r.H}</td><td>${r.T}</td><td>${r.S}</td><td>${r.I}</td><td>${r.A}</td><td>${r.opportunities}</td><td>${r.attendancePct}%</td></tr>`).join("")}</table>`;
  } else if(type==="violations"){
    title="Rekap Pelanggaran";
    content=`<h2>REKAP PELANGGARAN</h2><p>Periode ${fmtDate(state.violationFilters.from)} s.d. ${fmtDate(state.violationFilters.to)}</p><table>${violationRows().map(v=>`<tr><td>${fmtDate(v.violation_date)}</td><td>${esc(v.students?.full_name)}</td><td>${esc(v.students?.classes?.name)}</td><td>${esc(v.violation_types?.name)}</td><td>${v.points}</td><td>${esc(state.followUps.filter(f=>f.violation_id===v.id).map(f=>f.action_description||f.action_type).join("; "))}</td><td>${esc(v.recorded_by||"")}</td><td>${esc(v.status||"")}</td></tr>`).join("")}</table>`;
  } else {
    title="Rapor Karakter";
    const targets=raporPrintTargets();
    if(!targets.length){ toast(state.raporPrintMode==="student"?"Pilih nama siswa terlebih dahulu.":"Pilih kelas terlebih dahulu."); return; }
    const reportPages=targets.map((student,idx)=>{
      const r=studentReport(student.id,state.raporFrom,state.raporTo);
      if(!r)return "";
      const className=state.classes.find(c=>c.id===r.student.class_id)?.name||"-";
      const programs=state.programs.filter(p=>r.records.some(x=>x.program.id===p.id));
      return `<section class="character-page ${idx<targets.length-1?"page-break":""}">
        <div class="report-kop">${school.logo_url?`<img src="${esc(school.logo_url)}" class="report-logo">`:""}<div><h1>${esc((school.school_name||"").toUpperCase())}</h1><p>${esc(school.address||"")}</p><p>NPSN ${esc(school.npsn||"")}</p></div></div>
        <h2 class="report-title">LAPORAN PERKEMBANGAN KARAKTER PESERTA DIDIK</h2>
        <div class="student-info"><div><b>Nama</b><span>${esc(r.student.full_name||"-")}</span></div><div><b>Kelas</b><span>${esc(className)}</span></div><div><b>Periode</b><span>${esc(raporPeriodLabel())}</span></div></div>
        <div class="report-summary"><b>Ringkasan Perkembangan</b><p>${esc(characterStrength(r))}</p></div>
        <h3 class="report-section">1. Perkembangan Dimensi Profil Lulusan</h3>
        <table class="report-table"><tr><th>Dimensi Profil Lulusan</th><th>Capaian</th><th>Deskripsi Perkembangan</th></tr>${Object.values(r.byDim).map(x=>`<tr><td><b>${esc(x.dim.name)}</b></td><td class="center">${x.score!=null?`${x.score.toFixed(1)}<br><small>${esc(x.level)}</small>`:"—<br><small>Belum cukup data</small>"}</td><td>${esc(x.description||"Belum cukup data untuk menggambarkan perkembangan pada dimensi ini.")}</td></tr>`).join("")}</table>
        <h3 class="report-section">2. Bukti Kehadiran pada Kegiatan Pembiasaan</h3>
        <table class="report-table compact"><tr><th>Pembiasaan</th><th>Dimensi Profil Lulusan</th><th>H</th><th>T</th><th>S</th><th>I</th><th>A</th></tr>${programs.map(p=>{const c={H:0,T:0,S:0,I:0,A:0};(r.records||[]).filter(x=>x.program.id===p.id).forEach(x=>c[x.status==="HADIR"?"H":x.status==="TERLAMBAT"?"T":x.status==="SAKIT"?"S":x.status==="IZIN"?"I":"A"]++);const dims=state.programDpl.filter(x=>x.habit_program_id===p.id).map(x=>state.dimensions.find(d=>d.id===x.dpl_id)?.name).filter(Boolean).join(" + ");return `<tr><td>${esc(p.name)}</td><td>${esc(dims||"-")}</td><td>${c.H}</td><td>${c.T}</td><td>${c.S}</td><td>${c.I}</td><td>${c.A}</td></tr>`}).join("")}</table>
        <div class="report-note"><b>Catatan Penguatan</b><p>${esc(characterFollowUp(r))}</p></div>
        <div class="sign"><div>Mengetahui,<br>Kepala Sekolah<br><br><br><b>${esc(school.principal_name||"")}</b>${school.principal_nip?`<br>NIP. ${esc(school.principal_nip)}`:""}</div><div>Mengetahui,<br>Kesiswaan<br><br><br><b>${esc(school.kesiswaan_name||"")}</b>${school.kesiswaan_nip?`<br>NIP/NIK. ${esc(school.kesiswaan_nip)}`:""}</div></div>
      </section>`;
    }).join("");
    content=reportPages;
  }
  const win=window.open("","_blank");
  if(!win){toast("Popup diblokir browser.");return;}
  const commonKop = type === "character" ? "" : `<div class="kop"><h1>${esc((school.school_name||"SMKS GRAFIKA").toUpperCase())}</h1><p>${esc(school.address||"")}</p><p>NPSN ${esc(school.npsn||"")}</p></div>`;
  win.document.write(`<html><head><title>${title}</title><style>@page{size:A4;margin:12mm}body{font-family:Arial,sans-serif;font-size:10px;color:#111}h2{text-align:center;font-size:16px;margin:4px}.kop{text-align:center;border-bottom:2px solid #111;padding-bottom:8px;margin-bottom:12px}.kop h1{font-size:15px;margin:0}.kop p{margin:2px;font-size:9px}table{width:100%;border-collapse:collapse;margin-top:10px}th,td{border:1px solid #222;padding:5px;font-size:8px}th{background:#eee}.report-kop{display:flex;gap:14px;align-items:center;border-bottom:3px solid #1e4fbf;padding-bottom:10px}.report-logo{width:58px;height:58px;object-fit:contain}.report-kop h1{font-size:18px;margin:0}.report-kop p{margin:2px 0;font-size:10px}.report-title{text-align:center;font-size:15px;margin:14px 0 10px}.student-info{display:grid;grid-template-columns:1fr 1fr 1fr;border:1px solid #d5d9e2}.student-info div{padding:6px 8px;border-right:1px solid #d5d9e2}.student-info div:last-child{border-right:0}.student-info b{display:block;font-size:9px;color:#667085}.student-info span{font-size:10px}.report-summary,.report-note{background:#f5f8ff;border-left:4px solid #2b63c6;padding:8px 10px;margin:10px 0}.report-summary p,.report-note p{margin:4px 0;font-size:10px;line-height:1.45}.report-section{font-size:12px;margin:12px 0 5px}.report-table{width:100%;border-collapse:collapse}.report-table th,.report-table td{border:1px solid #cfd5df;padding:5px 6px;font-size:9px;vertical-align:top}.report-table th{background:#eef4ff}.report-table .center{text-align:center}.report-table.compact th,.report-table.compact td{font-size:9px;text-align:center}.report-table.compact th:nth-child(1),.report-table.compact td:nth-child(1),.report-table.compact th:nth-child(2),.report-table.compact td:nth-child(2){text-align:left}.sign{display:flex;justify-content:space-between;margin-top:35px;text-align:center}.sign>div{width:40%}.page-break{page-break-after:always;break-after:page}.character-page{min-height:260mm;box-sizing:border-box}@media print{body{print-color-adjust:exact}.character-page{break-inside:avoid}}</style></head><body>${commonKop}${content}<script>window.onload=()=>window.print()<\/script></body></html>`);
  win.document.close();
}
